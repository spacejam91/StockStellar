name: Daily scan

# Runs after the US close, renders the page, publishes it to Pages, and commits
# the updated log back.
#
# Two things worth knowing before relying on the schedule:
#
#  * GitHub's cron is BEST-EFFORT. Scheduled runs are routinely delayed 5-30
#    minutes and occasionally much longer at peak. Fine for an evening scan;
#    useless if you ever want a precise market-open trigger.
#  * GitHub disables scheduled workflows on a repository with no activity for
#    60 days. The daily log commit counts as activity, so this self-sustains --
#    but if you turn the commit step off, the schedule will eventually stop.
#
# The log (stockstellar.db) is committed deliberately. A point-in-time record is
# worthless if it resets every run, and Actions caches are not durable enough to
# hold it. It contains market data only -- no keys, no personal data.

on:
  schedule:
    # 05:30 UTC = 01:30 ET, which is the PREVIOUS weekday's session -- hence
    # Tue-Sat, not Mon-Fri.
    #
    # It used to run at 22:30 UTC, half an hour after the US close, and that
    # was the whole problem. Yahoo rate-limits datacenter IPs hardest right
    # then, and it does it silently: yf.download returns an empty frame per
    # failed ticker instead of raising, so the scan completes on whatever came
    # back. Measured on the same session, same code: 07:25 UTC returned all
    # 8,701 tickers and 3,095 eligible names; 22:30 UTC returned about a third
    # (1,076 eligible) and the next one a tenth (330). composite_z is a
    # percentile, so a short universe does not shorten the list -- it moves
    # every score in it.
    - cron: "30 5 * * 2-6"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Also score this many prior sessions"
        default: "0"
      provider:
        description: "hybrid | yahoo | polygon | mock"
        default: "hybrid"

concurrency:
  group: daily-scan
  cancel-in-progress: false

permissions:
  contents: write      # commit the log back
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Three fetch attempts of ~8 minutes each plus 15 minutes of backoff, with
    # room for the universe refresh and the site build.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Self-check before trusting anything
        # Test 10 first. If the pipeline can manufacture an edge from noise,
        # publishing its output is worse than publishing nothing.
        run: |
          uv run python -m tests.test_null_control
          uv run python -m tests.test_provider_hygiene
          uv run python -m tests.test_empty_day
          uv run python -m tests.test_log_integrity
          uv run python -m tests.test_selection

      - name: Refresh universe and sectors
        # Cheap and keeps listings/sectors current. Never fail the run on it --
        # a stale universe still scans; no universe at all does not.
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT || 'aaron-thompson@outlook.com' }}
        run: |
          uv run python scripts/build_universe.py
          uv run python scripts/fetch_sectors.py --no-api

      - name: Restore the log from CSV
        # The point-in-time log lives in git as TEXT, not as the SQLite file.
        # A tracked binary cannot be merged, so `git pull` resolves it by
        # overwrite -- which destroyed a real 90-session log when CI's fresh
        # one-session database landed on a laptop. Import is additive: it adds
        # rows the database lacks and never rewrites one it already has.
        run: uv run python -m scanner.logexport import

      - name: Run the scan
        id: scan
        # NOT fatal, and that is deliberate. The provider refuses a run whose
        # coverage is below MIN_COVERAGE, which is correct -- a third of the
        # market missing moves every percentile -- but a refusal must not also
        # take the page down. On a refusal the site is rebuilt from the log as
        # it stands, so the last honest session stays published instead of
        # being replaced by a degraded one or by nothing.
        continue-on-error: true
        env:
          # hybrid = Polygon for the US half, Yahoo for Canada. Yahoo alone
          # cannot serve 8,700 names from a GitHub runner: it returned a third
          # of them at 22:30 UTC and a tenth on the next run, silently, because
          # yf.download stores an empty frame per failed ticker rather than
          # raising. Polygon's grouped-daily endpoint is one request for the
          # whole US market and is free from a datacenter IP -- but has no
          # Canadian data at any tier, so Canada stays on Yahoo, where ~2,800
          # names is well inside what it will serve.
          #
          # The scheduled run stays on YAHOO for now, and that is a measured
          # decision rather than caution. Massive's free tier is 5 requests per
          # minute -- an earlier note in polygon_data.py claimed the grouped
          # endpoint was unmetered, which was simply wrong. One request returns
          # one session, so a cold 400-session build is ~80 minutes and 0.6 GB
          # of cache: fine once on a laptop, and it does not fit a 75-minute
          # job. Until that cache is persisted between runs, selecting hybrid
          # here would trade a coverage problem for a timeout.
          #
          # Meanwhile the schedule move did the job on its own: 05:30 UTC
          # returned 8,700 of 8,700 tickers twice, against 1,076 and then 330
          # at 22:30. Pass provider=hybrid by hand to use Massive for the US
          # half once its cache is warm.
          MARKET_DATA: ${{ github.event.inputs.provider || 'yahoo' }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          set -o pipefail
          # Three attempts with a long gap. Yahoo's throttling is stochastic,
          # so a run refused for coverage is often fine twenty minutes later --
          # and a refused run costs a whole session of log.
          for attempt in 1 2 3; do
            echo "::group::scan attempt $attempt"
            if uv run python -m scanner \
                 --history-days "${{ github.event.inputs.history_days || 0 }}" \
                 --backfill 2>&1 | tee scan-output.txt; then
              echo "::endgroup::"
              echo "scanned=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt was refused or failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 300))
          done
          echo "scanned=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Say plainly whether this session was scanned
        # A red X on a scheduled job is easy to miss; a summary is not.
        run: |
          if [ "${{ steps.scan.outputs.scanned }}" = "true" ]; then
            echo "### Scan complete" >> "$GITHUB_STEP_SUMMARY"
            grep -E "^  (eligible|fetched|bars/ticker)" scan-output.txt \
              | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "### No session logged — the fetch was refused" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The page still shows the last good session. Three attempts were made." \
              >> "$GITHUB_STEP_SUMMARY"
            tail -20 scan-output.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Build the static site
        run: uv run python scripts/build_site.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit the updated log
        if: steps.scan.outputs.scanned == 'true'
        # Never fatal. This is the LAST step of the job and `deploy` needs the
        # job to succeed, so a failure here blocked publishing entirely -- which
        # is what happened on the first run: the scan worked, the artifact
        # uploaded, and a push race meant the page was never deployed. Losing a
        # day of log is a small problem; not publishing the page is the point.
        continue-on-error: true
        run: |
          set -u
          git config user.name  "stockstellar-bot"
          git config user.email "noreply@github.com"

          # Do NOT rebase or merge. Every file committed here is a regenerated
          # artifact -- a binary SQLite log and two derived CSVs -- so a
          # three-way merge has nothing sensible to do and produces conflicts
          # git cannot resolve. Rebasing failed exactly that way on run 2, and
          # the retry loop then kept pulling with unmerged files, which can
          # never succeed.
          #
          # Instead: take origin/main's history, keep this runner's files, and
          # commit them on top. "Ours wins" is correct for generated output.
          #
          # --mixed, NOT --soft. `reset --soft` moves HEAD and leaves the INDEX
          # holding the tree this runner checked out 20 minutes ago, so the
          # commit built on top of it reverts every file that changed on main in
          # the meantime -- silently, because `git diff --staged` is not
          # consulted for those paths and the push succeeds. Any code pushed
          # while a scan was running would be undone by the scan's own log
          # commit. --mixed resets the index to origin/main and leaves the
          # working tree, so re-adding only data/log gives exactly "origin/main
          # plus this runner's log".
          uv run python -m scanner.logexport export
          # Every session in scan_day must have a score partition, and every
          # partition must be from the newest run that produced scores. The
          # commit previously staged only data/log/*.csv, so data/log/scores/
          # was never added and every cross-section the scheduled scan produced
          # died with the runner.
          uv run python -m scanner.logexport verify

          for i in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add -f data/log data/universe_us.csv data/universe_ca.csv
            if git diff --staged --quiet; then
              echo "nothing to commit"; exit 0
            fi
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "log pushed"; exit 0
            fi
            echo "push attempt $i lost a race; retrying against the new tip"
            sleep $((i * 5))
          done
          echo "could not push the log after 3 attempts (scan and page are fine)" >&2

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
